<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Super Pirate Clicker Pro</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background: linear-gradient(#87ceeb,#1e90ff);
    color:white;
    text-align:center;
}

/* Battle Box */
#battleBox{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    width:500px;
    height:260px;
    background:black;
    border:4px solid white;
    padding:10px;
}

/* Battle Canvas Models */
#playerCanvas{
    position:absolute;
    bottom:20px;
    left:60px;
}

#enemyCanvas{
    position:absolute;
    bottom:20px;
    right:60px;
}

/* Money + Controls */
#moneyBox{
    position:absolute;
    top:280px;
    left:20px;
}

/* Shop moved to RIGHT side */
#shop{
    position:absolute;
    top:280px;
    right:20px;
    background:rgba(0,0,0,0.6);
    padding:15px;
    border:2px solid white;
}

button{
    padding:10px;
    margin:5px;
    font-size:15px;
}
</style>
</head>

<body>

<div id="battleBox">
    <h3>Battle Arena</h3>

    <div id="battleText">Click attack to start!</div>

    <canvas id="playerCanvas"></canvas>
    <canvas id="enemyCanvas"></canvas>
</div>

<div id="moneyBox">
    <h2>💰 Money: <span id="money">0</span></h2>

    <button onclick="attack()">Click Attack</button>
    <button onclick="useDevilFruit()">Devil Fruit Power</button>
</div>

<div id="shop">
    <h3>Upgrade Shop</h3>

    <button onclick="buyUpgrade('sword',50)">
        Sword (+5 dmg)
    </button>

    <button onclick="buyUpgrade('armor',100)">
        Armor (+20 HP)
    </button>
</div>

<script>

/* ========================
GAME STATE
======================== */

let money = 0;
let playerHP = 100;
let maxPlayerHP = 100;
let playerDmg = 10;
let devilFruitDmg = 25;

let enemyHP = 100;
let enemyMaxHP = 100;

let playerTurn = true;
let currentIsland = 1;
let bossMultiplier = 1.5;

/* ========================
IMAGES
======================== */

let playerImage = new Image();
playerImage.src = "images.jpg";

let enemyImage = new Image();
enemyImage.src = "https://i.imgur.com/8QfYk0M.png";

/* ========================
CANVASES
======================== */

let playerCanvas = document.getElementById("playerCanvas");
let pCtx = playerCanvas.getContext("2d");
playerCanvas.width = 120;
playerCanvas.height = 120;

let enemyCanvas = document.getElementById("enemyCanvas");
let eCtx = enemyCanvas.getContext("2d");
enemyCanvas.width = 120;
enemyCanvas.height = 120;

/* ========================
UI
======================== */

function updateUI(){

    document.getElementById("money").innerText = money;

    document.getElementById("battleText").innerHTML =
    "Enemy HP: " + enemyHP + "/" + enemyMaxHP + "<br>" +
    "Your HP: " + playerHP + "/" + maxPlayerHP + "<br>" +
    (playerTurn ? "Your turn! Click attack." : "Enemy attacking...");

    drawBattle();
}

/* ========================
DRAW MODELS IN BATTLE BOX
======================== */

function drawBattle(){

    pCtx.clearRect(0,0,120,120);
    pCtx.drawImage(playerImage,0,0,120,120);

    eCtx.clearRect(0,0,120,120);
    eCtx.drawImage(enemyImage,0,0,120,120);
}

/* ========================
ATTACK SYSTEM
======================== */

function attack(){

    if(!playerTurn) return;

    let damage = playerDmg + Math.floor(Math.random()*5);
    enemyHP -= damage;

    playerTurn = false;
    updateUI();

    if(enemyHP <= 0){
        rewardEnemy();
        return;
    }

    setTimeout(enemyAttack,1000);
}

function enemyAttack(){

    if(enemyHP <= 0) return;

    let damage = Math.floor(Math.random()*15)+5;
    playerHP -= damage;

    playerTurn = true;

    if(playerHP <= 0){
        alert("You lost! Resetting battle.");
        resetBattle();
    }

    updateUI();
}

/* ========================
DEVIL FRUIT POWER
======================== */

function useDevilFruit(){

    if(!playerTurn) return;

    enemyHP -= devilFruitDmg;

    playerTurn=false;
    updateUI();

    if(enemyHP <=0){
        rewardEnemy();
        return;
    }

    setTimeout(enemyAttack,1000);
}

/* ========================
REWARDS
======================== */

function rewardEnemy(){

    let reward = 50 * currentIsland;

    if(currentIsland>=3)
        reward = 200;

    money += reward;

    alert("Enemy defeated! You earned $" + reward);

    resetBattle();
}

function resetBattle(){

    playerHP = maxPlayerHP;

    enemyMaxHP = 50 + Math.floor(Math.random()*50)*currentIsland;

    if(currentIsland>=3){
        enemyMaxHP *= bossMultiplier;
    }

    enemyHP = enemyMaxHP;

    playerTurn = true;

    updateUI();
}

/* ========================
SHOP SYSTEM
======================== */

function buyUpgrade(item,cost){

    if(money < cost){
        alert("Not enough money!");
        return;
    }

    money -= cost;

    if(item=="sword") playerDmg +=5;
    if(item=="armor"){
        maxPlayerHP +=20;
        playerHP = maxPlayerHP;
    }

    updateUI();
}

/* ========================
START GAME
======================== */

resetBattle();

</script>

</body>
</html>
