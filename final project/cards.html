<!Doctype html>
<html>

<head>
    <title>
        Ziggy's card shop
    </title>
    <link rel="stylesheet" href="style.css">
</head>
<script>
    let slideIndex = 1;
    showSlides(slideIndex);

    function plusSlides(n) {
        showSlides(slideIndex += n);
    }

    function currentSlide(n) {
        showSlides(slideIndex = n);
    }

    function showSlides(n) {
        let i;
        let slides = document.getElementsByClassName("mySlides");
        let dots = document.getElementsByClassName("dot");

        if (n > slides.length) {
            slideIndex = 1;
        }

        if (n < 1) {
            slideIndex = slides.length;
        }

        for (i = 0; i < slides.length; i++) {
            slides[i].style.display = "none";
        }

        for (i = 0; i < dots.length; i++) {
            dots[i].className =
                dots[i].className.replace(" active", "");
        }

        slides[slideIndex - 1].style.display = "block";
        dots[slideIndex - 1].className += " active";
    }
</script>

<body>
    <strong>
        <h2>Ziggy's card shop</h2>
    </strong>
    <a href="index.html">
        <button>Home</button>
    </a>
    <a href="sell.html">
        <button>Sell Cards</button>
    </a>
    <a href="contact.html">
        <button>Contact</button>
    </a>
    <!-- Slideshow container -->
    <div class="slideshow-container">

        <!-- Full-width images with number and caption text -->
        <div class="mySlides fade">
            <div class="numbertext">1 / 3</div>
            <img src="ace sabo luffy.jpg" style="width: 100%;">
            <div class="text">Ace Sabo Luffy Super Rare</div>
        </div>

        <div class="mySlides fade">
            <div class="numbertext">2 / 3</div>
            <img src="elbaf luffy.jpg" style="width: 100%;">
            <div class="text">Elbaf luffy promo stamped</div>
        </div>

        <div class="mySlides fade">
            <div class="numbertext">3 / 3</div>
            <img src="enel.jpg" style="width: 100%;">
            <div class="text">Enel Super rare</div>
        </div>

        <!-- Next and previous buttons -->
        <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
        <a class="next" onclick="plusSlides(1)">&#10095;</a>
    </div>
    <br>

    <!-- The dots/circles -->
    <div style="text-align:center">
        <span class="dot" onclick="currentSlide(1)"></span>
        <span class="dot" onclick="currentSlide(2)"></span>
        <span class="dot" onclick="currentSlide(3)"></span>
    </div>

    <strong>
        <p> Other user sold cards.</p>
    </strong>
    <div id="cardList"></div>

    <script>
        let cards = JSON.parse(localStorage.getItem("cards")) || [];

        let cardList = document.getElementById("cardList");

        cards.forEach(card => {
            cardList.innerHTML += `
        <div class="card">
            <img src="${card.image}" width="200">
            <h3>${card.name}</h3>
            <p>$${card.price}</p>
        </div>
    `;
        });
    </script>

</body>

</html>
