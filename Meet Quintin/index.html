<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quinton & Gracie: Escape</title>
<style>
  body { margin: 0; background: #0a0a0a; overflow: hidden; font-family: sans-serif; color: white;}
  canvas { display: block; margin: auto; background: linear-gradient(#1a1a1a, #0d0d0d); }
  #menu {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  button {
    padding: 12px 24px;
    margin: 10px;
    font-size: 18px;
    border: none;
    background: #222;
    color: white;
    cursor: pointer;
  }
  button:hover { background: #444; }
</style>
</head>
<body>

<div id="menu">
  <h1>Choose Your Character</h1>
  <button onclick="startGame('Quinton')">Quinton</button>
  <button onclick="startGame('Gracie')">Gracie</button>
</div>

<canvas id="game" width="900" height="500"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player = {
  x: 100,
  y: 350,
  vx: 0,
  vy: 0,
  speed: 4,
  character: "",
  glow: "cyan"
};

let keys = {};
let gameStarted = false;
let time = 0;

document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

function startGame(char){
  player.character = char;
  document.getElementById("menu").style.display = "none";
  gameStarted = true;

  if(char === "Quinton"){
    player.glow = "cyan";
  } else {
    player.glow = "gold";
    player.x = 700;
  }
}

// ===== HIGH QUALITY CHARACTER DRAWING =====
function drawCharacter(p){
  let bob = Math.sin(time * 0.1) * 3;

  ctx.save();
  ctx.translate(p.x, p.y + bob);

  // Glow
  ctx.shadowBlur = 20;
  ctx.shadowColor = p.glow;

  // BODY
  ctx.fillStyle = "#222";
  ctx.fillRect(-15, -40, 30, 50);

  // HEAD
  ctx.fillStyle = "#f5d7b7";
  ctx.beginPath();
  ctx.arc(0, -60, 15, 0, Math.PI * 2);
  ctx.fill();

  // HAIR
  if(p.character === "Quinton"){
    ctx.fillStyle = "#111";
  } else {
    ctx.fillStyle = "#f2d16b"; // blonde
  }
  ctx.beginPath();
  ctx.arc(0, -70, 18, Math.PI, 2 * Math.PI);
  ctx.fill();

  // OUTFIT
  if(p.character === "Gracie"){
    // white tank top
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(-15, -40, 30, 25);

    // jeans
    ctx.fillStyle = "#8aa4c7";
    ctx.fillRect(-15, -15, 30, 25);

    // shoes
    ctx.fillStyle = "#fff";
    ctx.fillRect(-15, 10, 12, 8);
    ctx.fillRect(3, 10, 12, 8);
  }

  if(p.character === "Quinton"){
    // hoodie
    ctx.fillStyle = "#111";
    ctx.fillRect(-18, -45, 36, 55);

    // glowing eye
    ctx.fillStyle = "cyan";
    ctx.fillRect(3, -62, 4, 4);

    // robotic arm glow
    ctx.strokeStyle = "cyan";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(10, -20);
    ctx.lineTo(25, -10);
    ctx.stroke();
  }

  ctx.restore();
}

// ===== BACKGROUND =====
function drawBackground(){
  // lab floor
  ctx.fillStyle = "#1e1e1e";
  ctx.fillRect(0, 400, canvas.width, 100);

  // panels
  ctx.fillStyle = "#2a2a2a";
  for(let i = 0; i < canvas.width; i += 80){
    ctx.fillRect(i, 100, 60, 200);
  }
}

// ===== GAME LOOP =====
function update(){
  if(!gameStarted) return;

  time++;

  if(keys["ArrowRight"]) player.x += player.speed;
  if(keys["ArrowLeft"]) player.x -= player.speed;
  if(keys["ArrowUp"]) player.y -= player.speed;
  if(keys["ArrowDown"]) player.y += player.speed;

  draw();
  requestAnimationFrame(update);
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  drawBackground();
  drawCharacter(player);
}

update();
</script>
</body>
</html>
