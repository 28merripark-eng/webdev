<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>example gAME</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: #0a0f1a;
    font-family: Arial;
    color: white;
}

canvas { display: block; }

.title {
    position: absolute;
    top: 40px;
    width: 100%;
    text-align: center;
    font-size: 48px;
    text-shadow: 0 0 15px cyan;
}

.menu {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.btn {
    padding: 15px 40px;
    background: #111;
    border: 2px solid cyan;
    color: white;
    cursor: pointer;
}

.btn:hover {
    animation: flash var(--flash-speed,0.2s) infinite, shake 0.1s infinite;
}

@keyframes flash {
    0%{background:cyan;color:black;}
    50%{background:blue;}
    100%{background:cyan;}
}

@keyframes shake {
    0%{transform:translate(2px,-2px);}
    50%{transform:translate(-3px,3px);}
    100%{transform:translate(2px,-2px);}
}

/* overlays */
.overlay {
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: rgba(0,0,0,0.9);
    display:none;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    color:cyan;
    z-index:1000;
}
.overlay input, .overlay select {
    width:300px;
    margin-bottom:15px;
}
</style>
</head>

<body>

<div class="title" id="titleText">example gAME</div>

<div class="menu" id="menuDiv">
    <button class="btn" id="startBtn">START</button>
    <button class="btn" id="settingsBtn">SETTINGS</button>
    <button class="btn" id="exitBtn">EXIT</button>
</div>

<!-- SETTINGS -->
<div class="overlay" id="settingsOverlay">
    <label>Flash Speed</label>
    <input type="range" id="flashSpeed" min="0.05" max="1" step="0.01" value="0.2">

    <label>Volume</label>
    <input type="range" id="volume" min="0" max="1" step="0.01">

    <label>Graphics</label>
    <select id="graphics">
        <option>high</option>
        <option>medium</option>
        <option>low</option>
    </select>

    <label>Ball Material</label>
    <select id="ballMaterial">
        <option value="normal">Normal</option>
        <option value="rubber">Rubber</option>
        <option value="steel">Steel</option>
        <option value="wood">Wood</option>
    </select>

    <label>Gravity</label>
    <input type="range" id="gravity" min="0" max="1" step="0.01" value="0.4">

    <label>AI Difficulty</label>
    <select id="aiDifficulty">
        <option value="easy">Easy</option>
        <option value="normal">Normal</option>
        <option value="hard">Hard</option>
        <option value="nightmare">Nightmare</option>
    </select>

    <button id="closeSettings">CLOSE</button>
</div>

<!-- PAUSE -->
<div class="overlay" id="pauseOverlay">
    <h1>PAUSED</h1>

    <label>Gravity</label>
    <input type="range" id="gravityPause" min="0" max="1" step="0.01" value="0.4">

    <label>AI Difficulty</label>
    <select id="aiDifficultyPause">
        <option value="easy">Easy</option>
        <option value="normal">Normal</option>
        <option value="hard">Hard</option>
        <option value="nightmare">Nightmare</option>
    </select>

    <button id="returnMenuBtn">Return to Menu</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
// ================= CANVAS =================
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// ================= STATES =================
let pongActive = false;
let pongPaused = false;
let inMiniGame = false;

let aiDifficulty = "normal";
let bounceCount = 0;
let glitchTimer = 0;
let mazeLevel = 1;

// ================= MATERIALS =================
const materials = {
    normal:{g:0.4,f:0.99,b:0.8},
    rubber:{g:0.35,f:0.995,b:1.2},
    steel:{g:0.45,f:0.98,b:0.95},
    wood:{g:0.4,f:0.9,b:0.7}
};

// ================= TITLE BALL =================
let ball = {
    x: canvas.width/2,
    y: canvas.height/2,
    vx:0, vy:0,
    r:20,
    g:0.4, f:0.99, b:0.8,
    material:"normal"
};

// ================= PONG =================
let player = {x:50,y:200};
let ai = {x:canvas.width-70,y:200};

let pongBall = {
    x:canvas.width/2,
    y:canvas.height/2,
    vx:6,
    vy:4,
    r:15
};

let score = {p:0,a:0};

// ================= MAZE =================
let playerMaze = {x:100,y:100};
let monsters = [];

// ================= BACKGROUND =================
function drawBackground(){
    let g = ctx.createLinearGradient(0,0,0,canvas.height);
    g.addColorStop(0,"#0a0f1a");
    g.addColorStop(1,"#05080f");
    ctx.fillStyle = g;
    ctx.fillRect(0,0,canvas.width,canvas.height);
}

// ================= TITLE BALL =================
function updateTitleBall(){
    ball.vy += ball.g;
    ball.x += ball.vx;
    ball.y += ball.vy;

    ball.vx *= ball.f;
    ball.vy *= ball.f;

    if(ball.y+ball.r>canvas.height){
        ball.y = canvas.height-ball.r;
        ball.vy *= -ball.b;

        if(ball.material==="steel"){
            glitchTimer = 10;
        }
    }
}

// ================= PONG =================
function updatePong(){
    if(pongPaused) return;

    document.onmousemove = e => {
        player.y = e.clientY - 60;
    };

    let speed = 0.05;
    if(aiDifficulty==="easy") speed=0.03;
    if(aiDifficulty==="hard") speed=0.09;
    if(aiDifficulty==="nightmare") speed=0.15;

    ai.y += (pongBall.y-60 - ai.y)*speed;

    pongBall.x += pongBall.vx;
    pongBall.y += pongBall.vy;

    if(pongBall.y<0 || pongBall.y>canvas.height){
        pongBall.vy *= -1;
    }

    function hit(p){
        if(pongBall.x>p.x && pongBall.x<p.x+20 &&
           pongBall.y>p.y && pongBall.y<p.y+120){
            pongBall.vx *= -1;
            bounceCount++;
        }
    }

    hit(player);
    hit(ai);

    if(pongBall.x<0){score.a++; resetBall();}
    if(pongBall.x>canvas.width){score.p++; resetBall();}

    if(aiDifficulty==="nightmare" && bounceCount>=20 && !inMiniGame){
        glitchTimer = 120;
    }
}

function resetBall(){
    pongBall.x = canvas.width/2;
    pongBall.y = canvas.height/2;
    pongBall.vx = 6*(Math.random()>0.5?1:-1);
    pongBall.vy = 4*(Math.random()>0.5?1:-1);
}

// ================= MINI GAME =================
function startMiniGame(){
    inMiniGame = true;
    pongPaused = true;

    monsters = [];
    for(let i=0;i<mazeLevel;i++){
        monsters.push({
            x:Math.random()*canvas.width,
            y:Math.random()*canvas.height
        });
    }
}

function updateMiniGame(){
    monsters.forEach(m=>{
        let dx = playerMaze.x-m.x;
        let dy = playerMaze.y-m.y;
        let d = Math.sqrt(dx*dx+dy*dy);

        m.x += dx/d*(1+mazeLevel*0.3);
        m.y += dy/d*(1+mazeLevel*0.3);

        if(d<15){
            endMini(false);
        }
    });
}

function endMini(win){
    setTimeout(()=>{
        inMiniGame=false;
        pongPaused=false;
        bounceCount=0;
        mazeLevel=1;
    },2000);
}

// ================= DRAW =================
function draw(){
    drawBackground();

    if(glitchTimer>0){
        glitchTimer--;
        ctx.fillStyle="rgba(255,0,0,0.2)";
        ctx.fillRect(0,0,canvas.width,canvas.height);
        if(glitchTimer===0) startMiniGame();
    }

    if(!pongActive){
        ctx.beginPath();
        ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
        ctx.fillStyle="red";
        ctx.fill();
    }

    if(pongActive){
        ctx.fillRect(player.x,player.y,20,120);
        ctx.fillRect(ai.x,ai.y,20,120);

        ctx.beginPath();
        ctx.arc(pongBall.x,pongBall.y,15,0,Math.PI*2);
        ctx.fill();

        ctx.fillText(score.p,200,50);
        ctx.fillText(score.a,canvas.width-200,50);
    }

    if(inMiniGame){
        ctx.fillStyle="black";
        ctx.fillRect(0,0,canvas.width,canvas.height);

        let light = ctx.createRadialGradient(
            playerMaze.x,playerMaze.y,20,
            playerMaze.x,playerMaze.y,200
        );
        light.addColorStop(0,"white");
        light.addColorStop(1,"black");

        ctx.fillStyle=light;
        ctx.fillRect(0,0,canvas.width,canvas.height);

        ctx.fillStyle="white";
        ctx.fillRect(playerMaze.x,playerMaze.y,10,10);

        ctx.fillStyle="red";
        monsters.forEach(m=>ctx.fillRect(m.x,m.y,10,10));
    }
}

// ================= LOOP =================
function loop(){
    if(inMiniGame) updateMiniGame();
    else if(pongActive) updatePong();
    else updateTitleBall();

    draw();
    requestAnimationFrame(loop);
}
loop();

// ================= UI =================
startBtn.onclick = ()=>{
    titleText.style.display="none";
    menuDiv.style.display="none";
    pongActive=true;
};

settingsBtn.onclick = ()=> settingsOverlay.style.display="flex";
closeSettings.onclick = ()=> settingsOverlay.style.display="none";

exitBtn.onclick = ()=> window.close();

document.addEventListener("keydown",e=>{
    if(e.key==="Escape"){
        pongPaused=!pongPaused;
        pauseOverlay.style.display = pongPaused?"flex":"none";
    }

    if(inMiniGame){
        if(e.key==="w") playerMaze.y-=5;
        if(e.key==="s") playerMaze.y+=5;
        if(e.key==="a") playerMaze.x-=5;
        if(e.key==="d") playerMaze.x+=5;
    }
});

returnMenuBtn.onclick = ()=>{
    pongActive=false;
    pongPaused=false;
    titleText.style.display="block";
    menuDiv.style.display="flex";
};
</script>
</body>
</html>
