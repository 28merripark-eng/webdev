<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Blox3D — Prototype</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="ui">
        <div id="info">Fruits: <span id="fruitCount">0</span> | Gear: <span id="gearLevel">1</span></div>
        <div id="controls" style="font-size: 12px; margin-top: 5px; background: rgba(0,0,0,0.5); padding: 6px; border-radius: 4px;">K: Attack | 2: Gear 2 | 3: Gear 3</div>
        <div id="message"></div>
        <div id="debug"
            style="font-size: 12px; margin-top: 10px; background: rgba(0,0,0,0.7); padding: 8px; max-width: 300px; word-wrap: break-word;">
            Loading...</div>
    </div>
    <script src="https://unpkg.com/three@0.152.2/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.152.2/examples/js/loaders/GLTFLoader.js"></script>
    <script src="game.js"></script>
</body>

</html>
