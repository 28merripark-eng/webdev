<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 32 32">
  <!-- simple Luffy-ish face / hat icon (procedural, stylized) -->
  <rect width="32" height="32" rx="4" fill="#fff8e6" />
  <!-- hat brim -->
  <ellipse cx="16" cy="8" rx="12" ry="4" fill="#ffd700" />
  <rect x="6" y="6" width="20" height="4" fill="#f4d542" />
  <rect x="10" y="8" width="12" height="2" fill="#cc3333" />
  <!-- face -->
  <circle cx="16" cy="16" r="6" fill="#f1c27d" />
  <!-- eyes -->
  <rect x="12" y="15" width="1.5" height="1.5" fill="#000" />
  <rect x="18.5" y="15" width="1.5" height="1.5" fill="#000" />
  <!-- smile -->
  <path d="M12 18 Q16 20 20 18" stroke="#000" stroke-width="0.8" fill="none" stroke-linecap="round" />
  <!-- bandana-like hat band -->
  <rect x="9" y="10" width="14" height="2" fill="#cc3333" />
</svg>