<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 32 32">
  <!-- simple bandit sprite: masked bandana and darker clothes -->
  <rect width="32" height="32" rx="4" fill="#fff8f0" />
  <!-- hat / bandana -->
  <ellipse cx="16" cy="8" rx="11" ry="3.5" fill="#333" />
  <rect x="6" y="6" width="20" height="4" fill="#222" />
  <rect x="9" y="8" width="14" height="2" fill="#bb2222" />
  <!-- face -->
  <circle cx="16" cy="16" r="5" fill="#e8c9a0" />
  <!-- eye mask -->
  <rect x="10" y="14" width="12" height="3" fill="#111" />
  <!-- mouth -->
  <rect x="14" y="18" width="4" height="1" fill="#000" />
  <!-- torso -->
  <rect x="9" y="20" width="14" height="8" fill="#3b3b3b" />
  <!-- arms -->
  <rect x="6" y="20" width="3" height="6" fill="#3b3b3b" />
  <rect x="23" y="20" width="3" height="6" fill="#3b3b3b" />
</svg>