<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>One Piece Clicker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header>
      <h1>One Piece Clicker</h1>
      <p class="subtitle">Click to gather Berries and recruit your crew!</p>
    </header>

    <section id="game-area">
      <div id="scoreboard">
        <div>Berries: <span id="berries">0</span></div>
        <div>Per Click: <span id="perClick">1</span></div>
        <div>Auto CPS: <span id="cps">0</span></div>
      </div>

      <button id="clickBtn" class="big-btn">👒 Gomu Gomu! Click</button>

      <div id="shop">
        <h2>Recruit / Upgrades</h2>
        <div class="shop-list" id="shopList"></div>
      </div>

      <div id="controls">
        <button id="saveBtn">Save</button>
        <button id="loadBtn">Load</button>
        <button id="resetBtn">Reset</button>
      </div>
    </section>

    <footer>
      <small>Made with ❤️ — simple clicker prototype</small>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
