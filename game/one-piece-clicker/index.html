<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>One Piece Clicker</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main>
        <header>
            <h1>One Piece Clicker</h1>
            <p class="subtitle">Click to gather Berries and recruit your crew!</p>
        </header>

        <section id="game-area">
            <div id="scoreboard">
                <div style="display:flex;align-items:center;gap:10px">
                    <div>Berries: <span id="berries">0</span></div>
                    <div>Per Click: <span id="perClick">1</span></div>
                    <div>Auto CPS: <span id="cps">0</span></div>
                </div>
                <div style="display:flex;align-items:center;gap:12px;margin-top:8px">
                    <div id="playerCard" style="display:flex;align-items:center;gap:8px">
                        <img id="playerSprite" src="" alt="player"
                            style="width:56px;height:56px;border-radius:6px;border:2px solid #333;background:#fff" />
                        <div>
                            <div style="font-weight:700">Luffy</div>
                            <div class="hpbar" style="width:140px">
                                <div id="playerHpFill"></div>
                            </div>
                            <div id="playerHpText" style="font-size:12px;color:#333">HP: 100 / 100</div>
                        </div>
                    </div>
                    <div style="margin-left:auto">Bandits defeated: <span id="defeated">0</span></div>
                </div>
            </div>

            <div id="battle">
                <div id="enemyCard">
                    <img id="enemySprite" src="" alt="enemy" />
                    <div id="enemyInfo">
                        <div id="enemyName">Bandit</div>
                        <div id="enemyLevel">Lv. 1</div>
                        <div class="hpbar">
                            <div id="enemyHpFill"></div>
                        </div>
                        <div id="enemyHpText">HP: 30 / 30</div>
                    </div>
                </div>
            </div>

            <button id="clickBtn" class="big-btn">👊 Attack</button>

            <div id="shop">
                <h2>Recruit / Upgrades</h2>
                <div class="shop-list" id="shopList"></div>
            </div>

            <div id="controls">
                <button id="saveBtn">Save</button>
                <button id="loadBtn">Load</button>
                <button id="resetBtn">Reset</button>
            </div>
        </section>

        <footer>
            <small>Made with ❤️ — simple clicker prototype</small>
        </footer>
    </main>

    <script src="game.js"></script>
</body>

</html>
