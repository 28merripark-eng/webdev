<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CHAOS MODE FIXED</title>
<style>
body{margin:0;overflow:hidden;background:#000;font-family:monospace;}
canvas{display:block;}
#menu{
position:fixed;inset:0;
background:#111;
color:white;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}
button{padding:10px;margin:5px;cursor:pointer;}
</style>
</head>
<body>

<div id="menu">
<h1>CHAOS MODE</h1>
<button onclick="startGame()">Start</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let keys={};
document.addEventListener("keydown",e=>keys[e.key]=true);
document.addEventListener("keyup",e=>keys[e.key]=false);

let gravity=0.6;
let gameSpeed=1;
let shake=0;

let player;
let enemies=[];
let bullets=[];
let platforms=[];
let difficulty=1;

function resetPlayer(){
player={
x:100,y:600,
w:40,h:40,
vx:0,vy:0,
speed:4,
jump:-12,
onGround:false,
health:5,
maxHealth:5
};
}

function startGame(){
document.getElementById("menu").style.display="none";
resetLevel();
}

function resetLevel(){

resetPlayer();

enemies=[];
bullets=[];
platforms=[{x:0,y:700,w:2000,h:200}];

let enemyCount=1+difficulty;

for(let i=0;i<enemyCount;i++){
enemies.push({
x:600+i*200,
y:650,
w:50,
h:50,
vx:(2+difficulty*0.3),
shootTimer:100
});
}
}

/* UPDATE */
function update(){

shake=Math.max(0,shake-1);

player.vy+=gravity;

/* LEFT / RIGHT */
if(keys["ArrowLeft"]) player.vx=-player.speed*gameSpeed;
else if(keys["ArrowRight"]) player.vx=player.speed*gameSpeed;
else player.vx=0;

/* FIXED JUMP (NO GLITCH FLYING) */
if(keys["ArrowUp"] && player.onGround){
player.vy=player.jump;
player.onGround=false;
}

player.x+=player.vx;
player.y+=player.vy;

/* HARD VELOCITY LIMIT (prevents flying bug) */
if(player.vy<-20) player.vy=-20;
if(player.vy>20) player.vy=20;

player.onGround=false;

/* PLATFORM COLLISION */
platforms.forEach(p=>{
if(player.x<p.x+p.w&&player.x+player.w>p.x&&
player.y<p.y+p.h&&player.y+player.h>p.y){

if(player.vy>=0){
player.y=p.y-player.h;
player.vy=0;
player.onGround=true;
}
}
});

/* ENEMIES */
enemies.forEach(e=>{

e.x+=e.vx*gameSpeed;

if(e.x<400||e.x>1400)e.vx*=-1;

/* Shooting */
e.shootTimer--;
if(e.shootTimer<=0){
bullets.push({
x:e.x,
y:e.y,
w:10,
h:10,
vx:(player.x<e.x?-5:5)*gameSpeed
});
e.shootTimer=120-difficulty*2;
}

/* Contact damage */
if(player.x<e.x+e.w&&player.x+player.w>e.x&&
player.y<e.y+e.h&&player.y+player.h>e.y){
damagePlayer();
}
});

/* BULLETS */
bullets.forEach((b,i)=>{
b.x+=b.vx;

if(player.x<b.x+b.w&&player.x+player.w>b.x&&
player.y<b.y+b.h&&player.y+player.h>b.y){
bullets.splice(i,1);
damagePlayer();
}
});

/* WIN */
if(player.x>1800){
difficulty++;
gameSpeed+=0.1;
resetLevel();
}

if(player.y>1000) damagePlayer();
}

function damagePlayer(){
player.health--;
shake=15;
if(player.health<=0) gameOver();
}

function gameOver(){
document.getElementById("menu").style.display="flex";
document.getElementById("menu").innerHTML=
`<h1>YOU SURVIVED LEVEL ${difficulty}</h1>
<button onclick="restart()">Restart</button>`;
}

function restart(){
difficulty=1;
gameSpeed=1;
startGame();
}

/* DRAW */
function draw(){

let offsetX=(Math.random()-0.5)*shake;
let offsetY=(Math.random()-0.5)*shake;

ctx.save();
ctx.translate(offsetX,offsetY);

ctx.fillStyle="#111";
ctx.fillRect(0,0,canvas.width,canvas.height);

/* Platforms */
ctx.fillStyle="#654321";
platforms.forEach(p=>{
ctx.fillRect(p.x,p.y,p.w,p.h);
});

/* Player */
ctx.fillStyle="red";
ctx.fillRect(player.x,player.y,40,40);

/* Enemies */
ctx.fillStyle="white";
enemies.forEach(e=>{
ctx.fillRect(e.x,e.y,e.w,e.h);
});

/* Bullets */
ctx.fillStyle="yellow";
bullets.forEach(b=>{
ctx.fillRect(b.x,b.y,b.w,b.h);
});

ctx.restore();

/* HEALTH BAR */
let barWidth=300;
let healthPercent=player.health/player.maxHealth;

ctx.fillStyle="gray";
ctx.fillRect(20,20,barWidth,20);

ctx.fillStyle="lime";
ctx.fillRect(20,20,barWidth*healthPercent,20);

ctx.strokeStyle="white";
ctx.strokeRect(20,20,barWidth,20);

/* UI */
ctx.fillStyle="white";
ctx.fillText("Difficulty: "+difficulty,20,60);
ctx.fillText("Speed: "+gameSpeed.toFixed(1),20,80);
}

function loop(){
ctx.clearRect(0,0,canvas.width,canvas.height);
update();
draw();
requestAnimationFrame(loop);
}

resetPlayer();
loop();
</script>

</body>
</html>
