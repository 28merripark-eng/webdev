<script>
let currentUser = null;

/* STORAGE */
function getUsers(){
    return JSON.parse(localStorage.getItem("users")) || [];
}

function saveUsers(users){
    localStorage.setItem("users", JSON.stringify(users));
}

/* SIGNUP */
function signup(){
    let email = document.getElementById("email").value;
    let username = document.getElementById("username").value;
    let pass = document.getElementById("password").value;
    let confirmPass = document.getElementById("confirm").value;

    if(pass !== confirmPass){
        alert("Passwords do not match");
        return;
    }

    let users = getUsers();

    if(users.some(u => u.username === username)){
        alert("Username already taken");
        return;
    }

    users.push({
        email: email,
        username: username,
        password: pass,
        posts: [],
        profilePic: ""
    });

    saveUsers(users);

    localStorage.setItem("currentUser", username);
    loadUser(username);
}

/* LOGIN */
function login(){
    let email = document.getElementById("loginEmail").value;
    let pass = document.getElementById("loginPass").value;

    let users = getUsers();
    let found = users.find(u => u.email === email && u.password === pass);

    if(!found){
        alert("Invalid login");
        return;
    }

    localStorage.setItem("currentUser", found.username);
    loadUser(found.username);
}

/* LOAD USER */
function loadUser(username){
    let users = getUsers();
    currentUser = users.find(u => u.username === username);

    document.getElementById("auth").style.display="none";
    document.getElementById("app").style.display="block";

    renderFeed();
    renderStories();
}

/* AUTO LOGIN */
window.onload = function(){
    let remembered = localStorage.getItem("currentUser");
    if(remembered){
        loadUser(remembered);
    }
}

/* LOGOUT */
function logout(){
    localStorage.removeItem("currentUser");
    location.reload();
}

/* CREATE POST */
function createPost(){
    let file = document.getElementById("mediaInput").files[0];
    if(!file) return;

    let reader = new FileReader();
    reader.onload = function(e){
        currentUser.posts.push({
            media:e.target.result,
            type:file.type.startsWith("video")?"video":"image",
            likes:0,
            comments:[]
        });

        let users = getUsers();
        let index = users.findIndex(u=>u.username===currentUser.username);
        users[index]=currentUser;
        saveUsers(users);

        renderFeed();
    }
    reader.readAsDataURL(file);
}

/* RENDER FEED */
function renderFeed(){
    let feed = document.getElementById("feed");
    feed.innerHTML="";
    let users = getUsers();

    users.forEach(user=>{
        user.posts.forEach((post, i)=>{
            let div = document.createElement("div");
            div.className="post";

            let header = document.createElement("div");
            header.innerHTML = `
                <img src="${user.profilePic || ''}" class="profile-pic">
                ${user.username}
            `;
            div.appendChild(header);

            if(post.type==="image"){
                div.innerHTML += `<img src="${post.media}" class="post-media">`;
            } else {
                div.innerHTML += `<video src="${post.media}" class="post-media" controls></video>`;
            }

            div.innerHTML += `
                <button onclick="likePost('${user.username}',${i})">
                Like (${post.likes})
                </button>
            `;

            let commentInput = document.createElement("input");
            commentInput.placeholder="Comment...";
            commentInput.onkeydown=function(e){
                if(e.key==="Enter"){
                    post.comments.push({
                        user:currentUser.username,
                        text:commentInput.value,
                        pic:currentUser.profilePic
                    });
                    saveUsers(users);
                    renderFeed();
                }
            };
            div.appendChild(commentInput);

            post.comments.forEach(c=>{
                let com = document.createElement("div");
                com.className="comment";
                com.innerHTML=`
                    <img src="${c.pic||''}" class="profile-pic">
                    <span>${c.user}: ${c.text}</span>
                `;
                div.appendChild(com);
            });

            feed.appendChild(div);
        });
    });
}

/* LIKE */
function likePost(username,index){
    let users = getUsers();
    let user = users.find(u=>u.username===username);
    user.posts[index].likes++;
    saveUsers(users);
    renderFeed();
}

/* PROFILE */
function showProfile(){
    document.getElementById("homePage").style.display="none";
    document.getElementById("profilePage").style.display="block";
    document.getElementById("profileName").innerText=currentUser.username;
}

function showHome(){
    document.getElementById("homePage").style.display="block";
    document.getElementById("profilePage").style.display="none";
}

function setProfilePic(){
    let file = document.getElementById("profilePicInput").files[0];
    if(!file) return;

    let reader = new FileReader();
    reader.onload=function(e){
        currentUser.profilePic=e.target.result;
        let users=getUsers();
        let index=users.findIndex(u=>u.username===currentUser.username);
        users[index]=currentUser;
        saveUsers(users);
        renderFeed();
        renderStories();
    }
    reader.readAsDataURL(file);
}

/* STORIES */
function renderStories(){
    let stories = document.getElementById("stories");
    stories.innerHTML="";
    let users=getUsers();
    users.forEach(u=>{
        let div=document.createElement("div");
        div.className="story";
        div.innerHTML=`
            <img src="${u.profilePic||''}" class="profile-pic"><br>
            ${u.username}
        `;
        stories.appendChild(div);
    });
}
</script>
