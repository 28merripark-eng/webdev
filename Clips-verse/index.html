<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Clips Verse</title>
<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f1f3f4;
}

/* Auth Screen */
#auth{
    display:flex;
    height:100vh;
    justify-content:center;
    align-items:center;
}

.auth-box{
    background:white;
    padding:30px;
    width:350px;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.auth-box input{
    width:100%;
    padding:10px;
    margin:6px 0;
}

.auth-box button{
    width:100%;
    padding:10px;
    background:#4285F4;
    border:none;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

/* App Layout */
#app{
    display:none;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:220px;
    height:100vh;
    background:white;
    padding-top:20px;
    box-shadow:2px 0 5px rgba(0,0,0,0.1);
}

.sidebar button{
    width:100%;
    padding:15px;
    border:none;
    background:none;
    text-align:left;
    cursor:pointer;
    font-size:16px;
}

.main{
    margin-left:220px;
    padding:20px;
}

/* Stories */
.stories{
    display:flex;
    overflow-x:auto;
    margin-bottom:20px;
}

.story{
    text-align:center;
    margin-right:15px;
}

.profile-pic{
    width:35px;
    height:35px;
    border-radius:50%;
    object-fit:cover;
}

/* Post */
.post{
    width:300px;
    height:325px;
    background:white;
    margin-bottom:20px;
    padding:10px;
    border-radius:8px;
}

.post-media{
    width:100%;
    height:250px;
    object-fit:cover;
}

.comment{
    display:flex;
    align-items:center;
    margin-top:5px;
}

.comment span{
    margin-left:5px;
    font-size:12px;
}

</style>
</head>
<body>

<!-- AUTH -->
<div id="auth">
    <div class="auth-box">
        <h2>Clips Verse</h2>
        <input id="email" placeholder="Email">
        <input id="username" placeholder="Username">
        <input id="password" type="password" placeholder="Password">
        <input id="confirm" type="password" placeholder="Confirm Password">
        <button onclick="signup()">Sign Up</button>
        <hr>
        <input id="loginEmail" placeholder="Login Email">
        <input id="loginPass" type="password" placeholder="Login Password">
        <button onclick="login()">Login</button>
    </div>
</div>

<!-- APP -->
<div id="app">
    <div class="sidebar">
        <button onclick="showHome()">Home</button>
        <button onclick="showProfile()">Profile</button>
        <button onclick="logout()">Logout</button>
    </div>

    <div class="main">
        <div id="homePage">
            <h3>Stories</h3>
            <div class="stories" id="stories"></div>

            <h3>Create Post</h3>
            <input type="file" id="mediaInput">
            <button onclick="createPost()">Post</button>

            <h3>Feed</h3>
            <div id="feed"></div>
        </div>

        <div id="profilePage" style="display:none;">
            <h2 id="profileName"></h2>
            <input type="file" id="profilePicInput">
            <button onclick="setProfilePic()">Set Profile Picture</button>
        </div>
    </div>
</div>

<script>
let currentUser = null;

/* STORAGE */
function getUsers(){
    return JSON.parse(localStorage.getItem("users")) || [];
}

function saveUsers(users){
    localStorage.setItem("users", JSON.stringify(users));
}

/* SIGNUP */
function signup(){
    let email = emailInput.value;
    let username = usernameInput.value;
    let pass = password.value;
    let confirmPass = confirm.value;

    if(pass !== confirmPass){
        alert("Passwords do not match");
        return;
    }

    let users = getUsers();

    if(users.some(u => u.username === username)){
        alert("Username already taken");
        return;
    }

    users.push({
        email,
        username,
        password:pass,
        posts:[],
        profilePic:""
    });

    saveUsers(users);

    localStorage.setItem("currentUser", username);
    loadUser(username);
}

/* LOGIN */
function login(){
    let email = loginEmail.value;
    let pass = loginPass.value;

    let users = getUsers();
    let found = users.find(u => u.email === email && u.password === pass);

    if(!found){
        alert("Invalid login");
        return;
    }

    localStorage.setItem("currentUser", found.username);
    loadUser(found.username);
}

/* LOAD USER */
function loadUser(username){
    let users = getUsers();
    currentUser = users.find(u => u.username === username);

    auth.style.display="none";
    app.style.display="block";

    renderFeed();
    renderStories();
}

/* AUTO LOGIN ON REFRESH */
window.onload = function(){
    let remembered = localStorage.getItem("currentUser");
    if(remembered){
        loadUser(remembered);
    }
}

/* LOGOUT */
function logout(){
    localStorage.removeItem("currentUser");
    location.reload();
}

/* CREATE POST */
function createPost(){
    let file = mediaInput.files[0];
    if(!file) return;

    let reader = new FileReader();
    reader.onload = function(e){
        currentUser.posts.push({
            media:e.target.result,
            type:file.type.startsWith("video")?"video":"image",
            likes:0,
            comments:[]
        });

        let users = getUsers();
        let index = users.findIndex(u=>u.username===currentUser.username);
        users[index]=currentUser;
        saveUsers(users);

        renderFeed();
    }
    reader.readAsDataURL(file);
}

/* RENDER FEED */
function renderFeed(){
    feed.innerHTML="";
    let users = getUsers();

    users.forEach(user=>{
        user.posts.forEach(post=>{
            let div = document.createElement("div");
            div.className="post";

            let header = document.createElement("div");
            header.innerHTML=`<img src="${user.profilePic||''}" class="profile-pic"> ${user.username}`;
            div.appendChild(header);

            if(post.type==="image"){
                div.innerHTML+=`<img src="${post.media}" class="post-media">`;
            } else {
                div.innerHTML+=`<video src="${post.media}" class="post-media" controls></video>`;
            }

            div.innerHTML+=`<button onclick="likePost('${user.username}',${user.posts.indexOf(post)})">Like (${post.likes})</button>`;

            let commentInput = document.createElement("input");
            commentInput.placeholder="Comment...";
            commentInput.onkeydown=function(e){
                if(e.key==="Enter"){
                    post.comments.push({
                        user:currentUser.username,
                        text:commentInput.value,
                        pic:currentUser.profilePic
                    });
                    saveUsers(users);
                    renderFeed();
                }
            };
            div.appendChild(commentInput);

            post.comments.forEach(c=>{
                let com = document.createElement("div");
                com.className="comment";
                com.innerHTML=`<img src="${c.pic||''}" class="profile-pic"><span>${c.user}: ${c.text}</span>`;
                div.appendChild(com);
            });

            feed.appendChild(div);
        });
    });
}

/* LIKE */
function likePost(username,index){
    let users = getUsers();
    let user = users.find(u=>u.username===username);
    user.posts[index].likes++;
    saveUsers(users);
    renderFeed();
}

/* PROFILE */
function showProfile(){
    homePage.style.display="none";
    profilePage.style.display="block";
    profileName.innerText=currentUser.username;
}

function showHome(){
    homePage.style.display="block";
    profilePage.style.display="none";
}

function setProfilePic(){
    let file = profilePicInput.files[0];
    if(!file) return;

    let reader = new FileReader();
    reader.onload=function(e){
        currentUser.profilePic=e.target.result;
        let users=getUsers();
        let index=users.findIndex(u=>u.username===currentUser.username);
        users[index]=currentUser;
        saveUsers(users);
        renderFeed();
    }
    reader.readAsDataURL(file);
}

/* STORIES */
function renderStories(){
    stories.innerHTML="";
    let users=getUsers();
    users.forEach(u=>{
        let div=document.createElement("div");
        div.className="story";
        div.innerHTML=`<img src="${u.profilePic||''}" class="profile-pic"><br>${u.username}`;
        stories.appendChild(div);
    });
}
</script>

</body>
</html>
