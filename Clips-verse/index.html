<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Clips Verse</title>

<style>

body{
margin:0;
font-family:Arial;
background:#f0f2f5;
}

/* AUTH */

#auth{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.auth-box{
background:white;
padding:35px;
width:360px;
border-radius:12px;
box-shadow:0 4px 20px rgba(0,0,0,.12);
}

.auth-box input{
width:100%;
padding:11px;
margin:7px 0;
border:1px solid #ddd;
border-radius:6px;
}

.auth-box button{
width:100%;
padding:11px;
background:#1877f2;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

/* APP */

#app{
display:none;
}

.sidebar{
position:fixed;
left:0;
top:0;
width:230px;
height:100vh;
background:white;
box-shadow:2px 0 8px rgba(0,0,0,.1);
padding-top:25px;
}

.sidebar button{
width:100%;
padding:16px;
border:none;
background:none;
text-align:left;
font-size:15px;
cursor:pointer;
}

.main{
margin-left:240px;
padding:25px;
}

/* Feed */

.feed{
display:flex;
flex-direction:column;
align-items:center;
gap:25px;
}

.post{
width:320px;
background:white;
border-radius:14px;
overflow:hidden;
box-shadow:0 2px 12px rgba(0,0,0,.12);
}

.post-header{
display:flex;
align-items:center;
padding:12px;
gap:10px;
}

.post-media{
width:100%;
height:260px;
object-fit:cover;
}

.post-footer{
padding:12px;
font-size:13px;
}

.profile-pic{
width:38px;
height:38px;
border-radius:50%;
object-fit:cover;
}

textarea,input{
width:100%;
padding:10px;
margin-top:6px;
border-radius:6px;
border:1px solid #ddd;
}

body{margin:0;font-family:Arial;background:#f0f2f5;}
#auth{display:flex;justify-content:center;align-items:center;height:100vh;}
.auth-box{background:white;padding:35px;width:360px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.12);}
.auth-box input{width:100%;padding:11px;margin:7px 0;border:1px solid #ddd;border-radius:6px;box-sizing:border-box;}
.auth-box button{width:100%;padding:11px;background:#1877f2;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;}
#app{display:none;}
.sidebar{position:fixed;left:0;top:0;width:230px;height:100vh;background:white;box-shadow:2px 0 8px rgba(0,0,0,.1);padding-top:25px;}
.sidebar button{width:100%;padding:16px;border:none;background:none;text-align:left;font-size:15px;cursor:pointer;}
.main{margin-left:240px;padding:25px;}
.feed{display:flex;flex-direction:column;align-items:center;gap:25px;}
.post{width:320px;background:white;border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.12);}
.post-header{display:flex;align-items:center;padding:12px;gap:10px;}
.post-media{width:100%;height:260px;object-fit:cover;background:#e8edf3;}
.post-footer{padding:12px;font-size:13px;}
.profile-pic{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#dfe6ee;}
textarea,input{width:100%;padding:10px;margin-top:6px;border-radius:6px;border:1px solid #ddd;box-sizing:border-box;}
.comment{display:flex;align-items:center;gap:8px;margin-top:8px;word-break:break-word;}
.comment .profile-pic{width:24px;height:24px;}
</style>
</head>

<body>

<div id="auth">

<div class="auth-box">

<h2>Clips Verse</h2>

<input id="signupEmail" placeholder="Email">
<input id="signupUsername" placeholder="Username">
<input id="signupPassword" type="password" placeholder="Password">
<input id="signupConfirm" type="password" placeholder="Confirm Password">

<button onclick="signup()">Sign Up</button>

<hr>

<input id="loginEmail" placeholder="Login Email">
<input id="loginPassword" type="password" placeholder="Password">

<button onclick="login()">Login</button>

</div>
  <div class="auth-box">
    <h2>Clips Verse</h2>
    <input id="signupEmail" placeholder="Email">
    <input id="signupUsername" placeholder="Username">
    <input id="signupPassword" type="password" placeholder="Password">
    <input id="signupConfirm" type="password" placeholder="Confirm Password">
    <button id="signupBtn" type="button">Sign Up</button>
    <hr>
    <input id="loginEmail" placeholder="Login Email">
    <input id="loginPassword" type="password" placeholder="Password">
    <button id="loginBtn" type="button">Login</button>
  </div>
</div>

<div id="app">

<div class="sidebar">
<button onclick="showHome()">Home</button>
<button onclick="showProfile()">Profile</button>
<button onclick="logout()">Logout</button>
</div>

<div class="main">

<div id="homePage">

<h3>Create Post</h3>

<input type="file" id="postMedia">
<button onclick="createPost()">Post</button>

<div class="feed" id="feed"></div>

</div>

<div id="profilePage" style="display:none">

<h2 id="profileTitle"></h2>

<img id="profilePreview" class="profile-pic" style="width:90px;height:90px">

<input type="file" id="profileUpload">
<button onclick="setProfilePic()">Upload Profile Photo</button>

</div>

</div>
  <div class="sidebar">
    <button id="homeBtn" type="button">Home</button>
    <button id="profileBtn" type="button">Profile</button>
    <button id="logoutBtn" type="button">Logout</button>
  </div>

  <div class="main">
    <div id="homePage">
      <h3>Create Post</h3>
      <input type="file" id="postMedia" accept="image/*,video/*">
      <button id="postBtn" type="button">Post</button>
      <div class="feed" id="feed"></div>
    </div>

    <div id="profilePage" style="display:none">
      <h2 id="profileTitle"></h2>
      <img id="profilePreview" class="profile-pic" style="width:90px;height:90px" alt="Profile preview">
      <input type="file" id="profileUpload" accept="image/*">
      <button id="uploadProfileBtn" type="button">Upload Profile Photo</button>
    </div>
  </div>
</div>

<script>

/* DATABASE */
const authEl = document.getElementById("auth");
const appEl = document.getElementById("app");
const feedEl = document.getElementById("feed");
const homePageEl = document.getElementById("homePage");
const profilePageEl = document.getElementById("profilePage");
const profileTitleEl = document.getElementById("profileTitle");
const profilePreviewEl = document.getElementById("profilePreview");

const signupEmailEl = document.getElementById("signupEmail");
const signupUsernameEl = document.getElementById("signupUsername");
const signupPasswordEl = document.getElementById("signupPassword");
const signupConfirmEl = document.getElementById("signupConfirm");
const loginEmailEl = document.getElementById("loginEmail");
const loginPasswordEl = document.getElementById("loginPassword");
const postMediaEl = document.getElementById("postMedia");
const profileUploadEl = document.getElementById("profileUpload");

let currentUser = null;

function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function getUsers(){
return JSON.parse(localStorage.getItem("clipsUsers")) || [];
  return JSON.parse(localStorage.getItem("clipsUsers")) || [];
}

function saveUsers(users){
localStorage.setItem("clipsUsers",JSON.stringify(users));
  localStorage.setItem("clipsUsers", JSON.stringify(users));
}

/* SESSION */

let currentUser=null;

/* SIGNUP */

function signup(){
  const email = signupEmailEl.value.trim();
  const username = signupUsernameEl.value.trim();
  const pass = signupPasswordEl.value;
  const confirm = signupConfirmEl.value;

let email=signupEmail.value.trim();
let username=signupUsername.value.trim();
let pass=signupPassword.value;
let confirm=signupConfirm.value;

if(!email||!username||!pass)
return alert("Fill all fields");
  if(!email || !username || !pass || !confirm) return alert("Fill all fields");
  if(!email.includes("@")) return alert("Enter a valid email");
  if(pass !== confirm) return alert("Passwords do not match");

if(pass!==confirm)
return alert("Passwords do not match");
  const users = getUsers();
  if(users.some(u => u.username === username)) return alert("Username already exists");
  if(users.some(u => u.email === email)) return alert("Email already exists");

let users=getUsers();
  users.push({ email, username, password: pass, profilePic: "", posts: [] });
  saveUsers(users);

if(users.some(u=>u.username===username))
return alert("Username already exists");

users.push({
email,
username,
password:pass,
profilePic:"",
posts:[]
});

saveUsers(users);

localStorage.setItem("currentUser",username);

loadUser(username);
  localStorage.setItem("currentUser", username);
  loadUser(username);
}

/* LOGIN */

function login(){
  const email = loginEmailEl.value.trim();
  const pass = loginPasswordEl.value;

let email=loginEmail.value.trim();
let pass=loginPassword.value;

let users=getUsers();

let found=users.find(u=>u.email===email && u.password===pass);

if(!found)
return alert("Invalid login");
  const users = getUsers();
  const found = users.find(u => u.email === email && u.password === pass);
  if(!found) return alert("Invalid login");

localStorage.setItem("currentUser",found.username);

loadUser(found.username);
  localStorage.setItem("currentUser", found.username);
  loadUser(found.username);
}

/* LOAD USER */

function loadUser(username){

let users=getUsers();

currentUser=users.find(u=>u.username===username);

auth.style.display="none";
app.style.display="block";

renderFeed();
}

/* AUTO LOGIN */

window.onload=function(){
let remember=localStorage.getItem("currentUser");
if(remember) loadUser(remember);
  const users = getUsers();
  currentUser = users.find(u => u.username === username);

  if(!currentUser){
    localStorage.removeItem("currentUser");
    return;
  }

  authEl.style.display = "none";
  appEl.style.display = "block";
  showHome();
  renderFeed();
}

/* LOGOUT */

function logout(){
localStorage.removeItem("currentUser");
location.reload();
  localStorage.removeItem("currentUser");
  location.reload();
}

/* POST */

function createPost(){

let file=postMedia.files[0];
if(!file) return alert("Select file");

let reader=new FileReader();

reader.onload=function(e){

let users=getUsers();

let index=users.findIndex(u=>u.username===currentUser.username);

users[index].posts.unshift({
media:e.target.result,
type:file.type.startsWith("video")?"video":"image",
likes:0,
comments:[]
});

currentUser=users[index];

saveUsers(users);

renderFeed();
};

reader.readAsDataURL(file);
}

/* FEED */

function renderFeed(){

feed.innerHTML="";

let users=getUsers();

users.forEach(user=>{
user.posts.forEach((post,pIndex)=>{

let card=document.createElement("div");
card.className="post";

let header=document.createElement("div");
header.className="post-header";

header.innerHTML=`
<img src="${user.profilePic||''}" class="profile-pic">
<b>${user.username}</b>
`;

card.appendChild(header);

if(post.type==="image"){
card.innerHTML+=`<img src="${post.media}" class="post-media">`;
}else{
card.innerHTML+=`<video src="${post.media}" class="post-media" controls></video>`;
  if(!currentUser) return;

  const file = postMediaEl.files[0];
  if(!file) return alert("Select file");
  if(!file.type.startsWith("image") && !file.type.startsWith("video")){
    return alert("Only image or video files are allowed");
  }

  const reader = new FileReader();
  reader.onload = function(e){
    const users = getUsers();
    const index = users.findIndex(u => u.username === currentUser.username);
    if(index < 0) return;

    users[index].posts.unshift({
      media: e.target.result,
      type: file.type.startsWith("video") ? "video" : "image",
      likes: 0,
      comments: []
    });

    currentUser = users[index];
    saveUsers(users);
    postMediaEl.value = "";
    renderFeed();
  };

  reader.readAsDataURL(file);
}

let footer=document.createElement("div");
footer.className="post-footer";

footer.innerHTML=`
<button onclick="likePost('${user.username}',${pIndex})">
❤️ ${post.likes}
</button>
`;
function likePost(username, index){
  const users = getUsers();
  const user = users.find(u => u.username === username);
  if(!user || !user.posts[index]) return;

let commentBox=document.createElement("input");
commentBox.placeholder="Write comment...";

commentBox.onkeydown=function(e){
if(e.key==="Enter"){

post.comments.push({
user:currentUser.username,
pic:currentUser.profilePic,
text:commentBox.value
});

saveUsers(users);
renderFeed();
  user.posts[index].likes++;
  saveUsers(users);
  renderFeed();
}
};

footer.appendChild(commentBox);
function addComment(ownerUsername, postIndex, text){
  if(!currentUser) return;

post.comments.forEach(c=>{
let com=document.createElement("div");
com.innerHTML=`
<img src="${c.pic||''}" class="profile-pic">
${c.user}: ${c.text}
`;
footer.appendChild(com);
});
  const clean = text.trim();
  if(!clean) return;

card.appendChild(footer);
  const users = getUsers();
  const owner = users.find(u => u.username === ownerUsername);
  if(!owner || !owner.posts[postIndex]) return;

feed.appendChild(card);
  owner.posts[postIndex].comments.push({
    user: currentUser.username,
    pic: currentUser.profilePic,
    text: clean
  });

});
});
  saveUsers(users);
  renderFeed();
}

/* LIKE */

function likePost(username,index){

let users=getUsers();

let user=users.find(u=>u.username===username);

if(!user) return;

user.posts[index].likes++;

saveUsers(users);

renderFeed();
function renderFeed(){
  feedEl.innerHTML = "";

  const users = getUsers();
  users.forEach(user => {
    user.posts.forEach((post, pIndex) => {
      const card = document.createElement("div");
      card.className = "post";

      const header = document.createElement("div");
      header.className = "post-header";
      const safeUsername = escapeHtml(user.username);
      header.innerHTML = `
        <img src="${user.profilePic || ''}" class="profile-pic" alt="${safeUsername} profile picture">
        <b>${safeUsername}</b>
      `;
      card.appendChild(header);

      if(post.type === "image"){
        const media = document.createElement("img");
        media.src = post.media;
        media.className = "post-media";
        media.alt = "Post by " + user.username;
        card.appendChild(media);
      } else {
        const media = document.createElement("video");
        media.src = post.media;
        media.className = "post-media";
        media.controls = true;
        card.appendChild(media);
      }

      const footer = document.createElement("div");
      footer.className = "post-footer";

      const likeBtn = document.createElement("button");
      likeBtn.type = "button";
      likeBtn.textContent = `❤️ ${post.likes}`;
      likeBtn.addEventListener("click", () => likePost(user.username, pIndex));
      footer.appendChild(likeBtn);

      const commentBox = document.createElement("input");
      commentBox.placeholder = "Write comment...";
      commentBox.addEventListener("keydown", (e) => {
        if(e.key === "Enter"){
          addComment(user.username, pIndex, commentBox.value);
        }
      });
      footer.appendChild(commentBox);

      post.comments.forEach(c => {
        const com = document.createElement("div");
        com.className = "comment";
        com.innerHTML = `
          <img src="${c.pic || ''}" class="profile-pic" alt="${escapeHtml(c.user)} profile picture">
          <span>${escapeHtml(c.user)}: ${escapeHtml(c.text)}</span>
        `;
        footer.appendChild(com);
      });

      card.appendChild(footer);
      feedEl.appendChild(card);
    });
  });
}

/* PROFILE */

function showProfile(){
  if(!currentUser) return;

homePage.style.display="none";
profilePage.style.display="block";
  homePageEl.style.display = "none";
  profilePageEl.style.display = "block";
  profileTitleEl.textContent = currentUser.username;

profileTitle.innerText=currentUser.username;

if(currentUser.profilePic)
profilePreview.src=currentUser.profilePic;
  if(currentUser.profilePic){
    profilePreviewEl.src = currentUser.profilePic;
  } else {
    profilePreviewEl.removeAttribute("src");
  }
}

function showHome(){
homePage.style.display="block";
profilePage.style.display="none";
  homePageEl.style.display = "block";
  profilePageEl.style.display = "none";
}

/* PROFILE PHOTO */

function setProfilePic(){
  if(!currentUser) return;

let file=profileUpload.files[0];
if(!file) return alert("Select profile photo");
  const file = profileUploadEl.files[0];
  if(!file) return alert("Select profile photo");
  if(!file.type.startsWith("image")) return alert("Profile photo must be an image");

let reader=new FileReader();
  const reader = new FileReader();
  reader.onload = function(e){
    const users = getUsers();
    const index = users.findIndex(u => u.username === currentUser.username);
    if(index < 0) return;

reader.onload=function(e){
    users[index].profilePic = e.target.result;
    currentUser = users[index];

let users=getUsers();
    saveUsers(users);
    profilePreviewEl.src = currentUser.profilePic;
    profileUploadEl.value = "";
    renderFeed();
  };

let index=users.findIndex(u=>u.username===currentUser.username);

users[index].profilePic=e.target.result;

currentUser.profilePic=e.target.result;

saveUsers(users);

profilePreview.src=currentUser.profilePic;

renderFeed();
};

reader.readAsDataURL(file);
  reader.readAsDataURL(file);
}

document.getElementById("signupBtn").addEventListener("click", signup);
document.getElementById("loginBtn").addEventListener("click", login);
document.getElementById("postBtn").addEventListener("click", createPost);
document.getElementById("uploadProfileBtn").addEventListener("click", setProfilePic);
document.getElementById("homeBtn").addEventListener("click", showHome);
document.getElementById("profileBtn").addEventListener("click", showProfile);
document.getElementById("logoutBtn").addEventListener("click", logout);

window.addEventListener("load", () => {
  const remember = localStorage.getItem("currentUser");
  if(remember) loadUser(remember);
});
</script>

</body>
</html>
</html>
