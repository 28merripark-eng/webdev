
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Clips Verse</title>
<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#121212;
  color:white;
}

#app{display:none;}
.sidebar{
  width:200px;
  height:100vh;
  background:#1e1e1e;
  position:fixed;
  padding-top:20px;
}
.sidebar button{
  display:block;
  width:90%;
  margin:10px auto;
  padding:10px;
  background:none;
  border:none;
  color:white;
  font-size:16px;
  cursor:pointer;
}
.sidebar button:hover{background:#333;}

.main{
  margin-left:210px;
  padding:20px;
}

.post{
  background:#1f1f1f;
  padding:15px;
  margin-bottom:20px;
  border-radius:10px;
}

.post img, .post video{
  width:100%;
  border-radius:10px;
  margin-top:10px;
}

.like-btn{
  cursor:pointer;
  color:#ff4d6d;
}

input, textarea{
  width:100%;
  padding:8px;
  margin:5px 0;
  border-radius:5px;
  border:none;
}

button.primary{
  background:#ff4d6d;
  border:none;
  padding:10px;
  color:white;
  border-radius:5px;
  cursor:pointer;
}

#auth{
  text-align:center;
  margin-top:100px;
}

.hidden{display:none;}
</style>
</head>
<body>

<div id="auth">
  <h1>Clips Verse</h1>
  <input id="username" placeholder="Create Username (required)">
  <input id="password" type="password" placeholder="Create Password">
  <button class="primary" onclick="signup()">Sign Up</button>
  <button class="primary" onclick="login()">Login</button>
</div>

<div id="app">
  <div class="sidebar">
    <button onclick="showHome()">🏠 Home</button>
    <button onclick="showMessages()">💬 Messages</button>
    <button onclick="showProfile()">👤 Profile</button>
    <button onclick="logout()">🚪 Logout</button>
  </div>

  <div class="main">

    <div id="homeSection">
      <h2>Home Feed</h2>
      <textarea id="postText" placeholder="What's your clip about?"></textarea>
      <input id="imageURL" placeholder="Image URL (optional)">
      <input type="file" id="videoUpload" accept="video/*">
      <button class="primary" onclick="createPost()">Post</button>
      <div id="feed"></div>
    </div>

    <div id="messagesSection" class="hidden">
      <h2>Private Messages</h2>
      <input id="msgUser" placeholder="Send to (username)">
      <textarea id="msgText" placeholder="Message"></textarea>
      <button class="primary" onclick="sendMessage()">Send</button>
      <div id="messageBox"></div>
    </div>

    <div id="profileSection" class="hidden">
      <h2 id="profileTitle"></h2>
      <div id="profilePosts"></div>
    </div>

  </div>
</div>

<script>
let currentUser = null;

/* ---------- SAFE STORAGE SYSTEM ---------- */

if(!localStorage.getItem("clipsverse_data")){
  localStorage.setItem("clipsverse_data", JSON.stringify({
    users:{},
    posts:[],
    messages:[]
  }));
}

function getData(){
  return JSON.parse(localStorage.getItem("clipsverse_data"));
}

function saveData(data){
  localStorage.setItem("clipsverse_data", JSON.stringify(data));
}

/* ---------- AUTH ---------- */

function signup(){
  let user = username.value.trim();
  let pass = password.value.trim();

  if(!user) return alert("Username required!");
  if(user.length < 3) return alert("Username must be at least 3 characters.");

  let data = getData();

  if(data.users[user]){
    alert("Username already taken.");
    return;
  }

  data.users[user] = {
    password:pass,
    joined:new Date().toLocaleDateString()
  };

  saveData(data);
  alert("Account created!");
}

function login(){
  let user = username.value.trim();
  let pass = password.value.trim();
  let data = getData();

  if(data.users[user] && data.users[user].password === pass){
    currentUser = user;
    localStorage.setItem("clipsverse_session", user);
    startApp();
  } else {
    alert("Invalid login");
  }
}

function logout(){
  localStorage.removeItem("clipsverse_session");
  location.reload();
}

function autoLogin(){
  let savedUser = localStorage.getItem("clipsverse_session");
  if(savedUser){
    currentUser = savedUser;
    startApp();
  }
}

/* ---------- APP ---------- */

function startApp(){
  document.getElementById("auth").style.display="none";
  document.getElementById("app").style.display="block";
  loadFeed();
}

function createPost(){
  let text = postText.value;
  let img = imageURL.value;
  let videoFile = videoUpload.files[0];

  if(!text && !img && !videoFile) return alert("Add something!");

  if(videoFile){
    let reader = new FileReader();
    reader.onload = function(e){
      savePost(text,img,e.target.result);
    }
    reader.readAsDataURL(videoFile);
  } else {
    savePost(text,img,null);
  }
}

function savePost(text,img,video){
  let data = getData();
  data.posts.unshift({
    user:currentUser,
    text:text,
    img:img,
    video:video,
    likes:0,
    time:Date.now()
  });

  saveData(data);
  postText.value="";
  imageURL.value="";
  videoUpload.value="";
  loadFeed();
}

function loadFeed(){
  let data = getData();
  feed.innerHTML="";

  data.posts.forEach((post,index)=>{
    feed.innerHTML+=`
      <div class="post">
        <h4>@${post.user}</h4>
        <p>${post.text}</p>
        ${post.img ? `<img src="${post.img}">`:""}
        ${post.video ? `<video controls src="${post.video}"></video>`:""}
        <p class="like-btn" onclick="likePost(${index})">❤️ ${post.likes}</p>
      </div>
    `;
  });
}

function likePost(index){
  let data = getData();
  data.posts[index].likes++;
  saveData(data);
  loadFeed();
}

function showHome(){
  homeSection.classList.remove("hidden");
  messagesSection.classList.add("hidden");
  profileSection.classList.add("hidden");
}

function showMessages(){
  homeSection.classList.add("hidden");
  messagesSection.classList.remove("hidden");
  profileSection.classList.add("hidden");
  loadMessages();
}

function showProfile(){
  homeSection.classList.add("hidden");
  messagesSection.classList.add("hidden");
  profileSection.classList.remove("hidden");

  profileTitle.innerText = currentUser + "'s Profile";

  let data = getData();
  profilePosts.innerHTML="";

  data.posts.filter(p=>p.user===currentUser)
            .forEach(p=>{
              profilePosts.innerHTML+=`
                <div class="post">
                  <p>${p.text}</p>
                  ${p.img?`<img src="${p.img}">`:""}
                  ${p.video?`<video controls src="${p.video}"></video>`:""}
                </div>
              `;
            });
}

function sendMessage(){
  let to = msgUser.value;
  let text = msgText.value;
  if(!to || !text) return;

  let data = getData();

  if(!data.users[to]){
    alert("User does not exist.");
    return;
  }

  data.messages.push({
    from:currentUser,
    to:to,
    text:text,
    time:Date.now()
  });

  saveData(data);
  msgText.value="";
  loadMessages();
}

function loadMessages(){
  let data = getData();
  messageBox.innerHTML="";

  data.messages
      .filter(m=>m.from===currentUser || m.to===currentUser)
      .forEach(m=>{
        messageBox.innerHTML+=`
          <div class="post">
            <b>${m.from} ➜ ${m.to}</b>
            <p>${m.text}</p>
          </div>
        `;
      });
}

/* ---------- AUTO LOGIN ON LOAD ---------- */
autoLogin();
</script>

</body>
</html>
