<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Button of Doom – Easy Mode Disappears After Start</title>
<style>
  body { margin:0; overflow:hidden; background:black; display:flex; justify-content:center; align-items:center; height:100vh; position:relative; }
  #doomButton, #easyButton {
    width:150px; height:150px; border:none; border-radius:20px; cursor:pointer;
    position:absolute; top:50%; left:50%; transform:translate(-50%, -50%);
    transition: all 0.05s ease; z-index:1; font-size:20px; color:white;
  }
  #doomButton { background:red; }
  #easyButton { display:none; background:green; }
  #hiddenSpot {
    position:absolute;
    top:100px; left:100px;
    width:50px; height:50px;
    background:#333; /* dark gray hidden spot */
    z-index:0;
  }
  #popupAd {
    position:absolute; top:0; left:0; width:100%; height:100%;
    background:rgba(255,255,255,0.95);
    display:flex; justify-content:center; align-items:center;
    flex-direction:column; font-family:sans-serif; font-size:24px;
    z-index:2; display:none;
  }
  #skipBtn {
    margin-top:20px; padding:10px 20px; font-size:18px; cursor:pointer;
    background:black; color:white; border:none; border-radius:10px;
    display:none;
  }
  #cheatScreen {
    position:absolute; top:0; left:0; width:100%; height:100%;
    background:black;
    color:white; font-family:sans-serif; font-size:48px;
    display:flex; justify-content:center; align-items:center;
    z-index:5; display:none; flex-direction:column;
  }
</style>
</head>
<body>
<div id="hiddenSpot"></div>
<button id="doomButton">CLICK ME!</button>
<button id="easyButton">EASY MODE</button>

<div id="popupAd">
  <div>WATCH THIS AD!</div>
  <div id="skipBtn">Skip</div>
</div>

<div id="cheatScreen">STOP CHEATING</div>

<script>
const button = document.getElementById("doomButton");
const easyButton = document.getElementById("easyButton");
const hiddenSpot = document.getElementById("hiddenSpot");
const popup = document.getElementById("popupAd");
const skipBtn = document.getElementById("skipBtn");
const cheatScreen = document.getElementById("cheatScreen");

let clicks = 0;
let adActive = false;
let cheatActive = false;
let chaosActive = false;
let easyStack = 0;
let gameStarted = false;

// Button move speed
let speed = 200;

// Move button randomly
function randomPosition(){
  const x = Math.random()*(window.innerWidth - button.offsetWidth);
  const y = Math.random()*(window.innerHeight - button.offsetHeight);
  button.style.left = x + "px";
  button.style.top = y + "px";
}

// Show popup ad
function showPopup(){
  if(adActive || cheatActive) return;
  adActive = true;
  popup.style.display = "flex";
  skipBtn.style.display = "none";
  setTimeout(()=>{ skipBtn.style.display = "block"; }, 5000);
}
skipBtn.addEventListener("click", ()=>{
  popup.style.display = "none";
  adActive = false;
});

// Reveal easy mode button by clicking hidden spot
hiddenSpot.addEventListener("click", ()=>{
  if(!gameStarted) easyButton.style.display = "block";
});

// Easy button click stacks easy mode
easyButton.addEventListener("click", ()=>{
  easyStack++;
  chaosActive = false;
  clicks = 0;
  button.style.width = "150px";
  button.style.height = "150px";
  button.style.fontSize = "20px";
  button.style.left = "50%";
  button.style.top = "50%";
  easyButton.style.display = "none";
  gameStarted = true; // game starts when easy mode is clicked

  // Increase difficulty based on stack
  speed = Math.max(50, 200 - easyStack*20); 
  startChaos();
});

// Button click
button.addEventListener("click", ()=>{
  if(adActive || cheatActive) return;
  clicks++;
  
  if(!gameStarted) {
    gameStarted = true;
    easyButton.style.display = "none"; // Hide Easy Mode button once game starts
  }

  if(!chaosActive) chaosActive = true;

  if(chaosActive) randomPosition();

  const shrinkRate = 2 + easyStack; 
  if(clicks % (easyStack ? Math.max(1,5 - easyStack) : 2) === 0){
    const newSize = Math.max(10, button.offsetWidth - shrinkRate);
    button.style.width = newSize + "px";
    button.style.height = newSize + "px";
    button.style.fontSize = Math.max(6, parseInt(button.style.fontSize) - Math.ceil(shrinkRate/2)) + "px";
  }
});

// Cursor avoidance
document.addEventListener("mousemove", e=>{
  if(adActive || cheatActive || !chaosActive) return;
  const bx = button.offsetLeft + button.offsetWidth/2;
  const by = button.offsetTop + button.offsetHeight/2;
  const dx = e.clientX - bx;
  const dy = e.clientY - by;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if(dist < 100) randomPosition();
});

// Random background flashes faster with stacking
setInterval(()=>{
  if(cheatActive || !chaosActive) return;
  const flashChance = 0.2 + easyStack*0.05;
  if(Math.random()<flashChance){
    document.body.style.background = ["yellow","magenta","cyan","white","lime","orange","red","blue","pink","purple"][Math.floor(Math.random()*10)];
  } else document.body.style.background = "black";
}, 50);

// Random teleport
setInterval(()=>{
  if(adActive || cheatActive || !chaosActive) return;
  if(Math.random()<0.15 + easyStack*0.05) randomPosition();
}, speed);

// Random ads by time (stacked)
function scheduleRandomAd(){
  if(adActive || cheatActive || !chaosActive) return;
  let sizeFactor = button.offsetWidth / 150;
  let interval = Math.max(500, (5000 - easyStack*500) * sizeFactor);
  setTimeout(()=>{
    showPopup();
    scheduleRandomAd();
  }, interval + Math.random()*2000);
}
scheduleRandomAd();

// Anti-cheat: Tab, Enter, or both
let tabPressed = false;
document.addEventListener("keydown", e=>{
  if(e.code === "Tab") tabPressed = true;
  if((e.code === "Enter" || e.code === "Tab") && !cheatActive){
    triggerCheat();
  }
});
document.addEventListener("keyup", e=>{
  if(e.code === "Tab") tabPressed = false;
});

function triggerCheat(){
  cheatActive = true;
  chaosActive = false;
  button.style.display = "none";
  easyButton.style.display = "none";
  popup.style.display = "none";

  let flashCount = 0;
  const flashInterval = setInterval(()=>{
    cheatScreen.style.display = "flex";
    document.body.style.background = ["red","yellow","magenta","cyan","white","lime","orange","blue","pink","purple"][Math.floor(Math.random()*10)];
    flashCount++;
    if(flashCount>30){
      clearInterval(flashInterval);
      document.body.style.background = "black";
      cheatScreen.style.display = "flex";
    }
  }, 100);
}

// Start chaos
function startChaos(){
  chaosActive = true;
}
</script>
</body>
</html>
